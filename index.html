                <textarea placeholder="Description" value={newMenu.description} onChange={e => setNewMenu({...newMenu, description: e.target.value})} className="w-full text-sm rounded border px-3 py-2 outline-none focus:border-indigo-500 h-16" />
                <input type="text" placeholder="Price/Condition" value={newMenu.price} onChange={e => setNewMenu({...newMenu, price: e.target.value})} className="w-full text-sm rounded border px-3 py-2 outline-none focus:border-indigo-500" />
                <button type="submit" className="w-full bg-slate-800 text-white text-sm py-2 rounded hover:bg-slate-900">Add Menu</button>
              </form>
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
            <div className="p-4 bg-slate-50 border-b border-slate-200">
              <h3 className="font-bold text-slate-800 flex items-center">
                <MessageSquare className="w-5 h-5 mr-2 text-indigo-500" /> Visitor Questionnaire
              </h3>
            </div>
            <div className="p-4 flex-1 space-y-4">
              {questions.map(q => (
                <div key={q.id} className="relative p-3 rounded-lg border border-slate-200 bg-slate-50/50 pr-10">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-[10px] font-bold uppercase bg-slate-200 px-1.5 py-0.5 rounded">{q.type}</span>
                    <h4 className="font-semibold text-sm">{q.text}</h4>
                  </div>
                  {q.type === 'select' && <p className="text-xs text-slate-500 mt-1">Options: {q.options.join(', ')}</p>}
                  <button onClick={() => removeQuestion(q.id)} className="absolute top-3 right-3 text-slate-400 hover:text-red-500"><Trash2 className="w-4 h-4" /></button>
                </div>
              ))}
            </div>
            <div className="p-4 border-t border-slate-100 bg-slate-50">
              <form onSubmit={addQuestion} className="space-y-3">
                <input required type="text" placeholder="Question text" value={newQuestion.text} onChange={e => setNewQuestion({...newQuestion, text: e.target.value})} className="w-full text-sm rounded border px-3 py-2 outline-none focus:border-indigo-500" />
                <select value={newQuestion.type} onChange={e => setNewQuestion({...newQuestion, type: e.target.value})} className="w-full text-sm rounded border px-3 py-2 outline-none focus:border-indigo-500 bg-white">
                  <option value="text">Text Input</option>
                  <option value="select">Multiple Choice</option>
                </select>
                {newQuestion.type === 'select' && <input required type="text" placeholder="Options (comma separated)" value={newQuestion.optionsStr} onChange={e => setNewQuestion({...newQuestion, optionsStr: e.target.value})} className="w-full text-sm rounded border px-3 py-2 outline-none focus:border-indigo-500" />}
                <button type="submit" className="w-full bg-slate-800 text-white text-sm py-2 rounded hover:bg-slate-900">Add Question</button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    function AvailabilityManager({ availableSlots, setAvailableSlots, bookings, onCancelBooking }) {
      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6">
          <div className="mb-6 border-b border-slate-100 pb-4">
            <h2 className="text-xl font-bold text-slate-800">Manage Availability Calendar</h2>
          </div>
          <CalendarPicker 
            mode="host"
            availableSlots={availableSlots} 
            confirmedBookings={bookings.filter(b => b.status === 'confirmed')}
            setAvailableSlots={setAvailableSlots}
            onCancelBooking={onCancelBooking}
          />
        </div>
      );
    }

    function CalendarPicker({ mode, availableSlots, confirmedBookings = [], selectedSlots = [], onSlotToggle, setAvailableSlots, onCancelBooking }) {
      const [currentDate, setCurrentDate] = useState(startOfMonth(new Date()));
      const [hostSelectedDate, setHostSelectedDate] = useState(null); 
      const [newTimeStart, setNewTimeStart] = useState('18:00');
      const [newTimeEnd, setNewTimeEnd] = useState('21:00');

      const nextMonth = () => setCurrentDate(addMonths(currentDate, 1));
      const prevMonth = () => setCurrentDate(addMonths(currentDate, -1));
      const daysInMonth = eachDayOfInterval({ start: startOfWeek(startOfMonth(currentDate)), end: endOfWeek(endOfMonth(currentDate)) });
      const today = startOfDay(new Date());
      const isVisitor = mode === 'visitor';

      const handleAddSlot = () => {
        if (!hostSelectedDate) return;
        const newSlot = { id: `slot-${Date.now()}`, date: hostSelectedDate, startTime: newTimeStart, endTime: newTimeEnd };
        setAvailableSlots([...availableSlots, newSlot].sort((a, b) => a.startTime.localeCompare(b.startTime)));
      };

      return (
        <div className="flex flex-col lg:flex-row gap-6">
          <div className="flex-1">
            <div className="flex justify-between items-center mb-6 bg-slate-50 p-2 rounded-xl border border-slate-100">
              <button onClick={prevMonth} className="p-2 hover:bg-white rounded-lg text-slate-600"><ChevronLeft className="w-5 h-5"/></button>
              <h3 className="font-bold text-lg text-slate-800">{format(currentDate, 'MMMM yyyy')}</h3>
              <button onClick={nextMonth} className="p-2 hover:bg-white rounded-lg text-slate-600"><ChevronRight className="w-5 h-5"/></button>
            </div>
            
            <div className="grid grid-cols-7 gap-1 text-center mb-2">
              {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => (
                <div key={d} className="text-xs font-bold text-slate-400 uppercase">{d}</div>
              ))}
            </div>
            
            <div className="grid grid-cols-7 gap-1 sm:gap-2">
              {daysInMonth.map(day => {
                const dateStr = format(day, 'yyyy-MM-dd');
                const isCurrentMonth = isSameMonth(day, currentDate);
                const isPast = isBefore(day, today);
                
                const daySlots = availableSlots.filter(s => s.date === dateStr);
                const dayConfirmed = confirmedBookings.flatMap(b => b.slots.filter(s => s.date === dateStr).map(s => ({...s, eventName: b.eventName, bookingId: b.id})));
                
                const isSelectedByHost = !isVisitor && hostSelectedDate === dateStr;
                const hasVisitorSelectedSlot = isVisitor && selectedSlots.some(s => s.date === dateStr);

                let bgClass = "bg-white border-slate-200";
                if (!isCurrentMonth) bgClass = "bg-slate-50/50 text-slate-300 border-transparent";
                else if (isSelectedByHost) bgClass = "bg-indigo-50 border-indigo-400 ring-1 ring-indigo-400 shadow-sm";
                else if (hasVisitorSelectedSlot) bgClass = "bg-indigo-50 border-indigo-300 shadow-sm";
                else bgClass = "bg-white hover:border-slate-300 border-slate-200 shadow-sm";

                return (
                  <div 
                    key={day.toString()} 
                    onClick={() => !isVisitor && !isPast && setHostSelectedDate(dateStr)}
                    className={`min-h-[80px] sm:min-h-[100px] p-1.5 border rounded-xl transition-all flex flex-col ${bgClass} ${!isVisitor && !isPast ? 'cursor-pointer hover:shadow-md hover:-translate-y-0.5' : ''} ${isPast ? 'opacity-40 cursor-not-allowed bg-slate-50' : ''}`}
                  >
                    <div className="flex justify-end mb-1">
                      <span className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full ${isSameDay(day, today) ? 'bg-indigo-600 text-white' : 'text-slate-600'}`}>
                        {format(day, 'd')}
                      </span>
                    </div>
                    
                    <div className="flex flex-col gap-1 flex-1 overflow-y-auto hide-scrollbar">
                      {isVisitor && (
                        <>
                          {dayConfirmed.map(event => (
                            <div key={event.id} className="text-[10px] sm:text-xs bg-red-50 text-red-600 border border-red-100 px-1.5 py-0.5 rounded truncate font-medium flex items-center" title={event.eventName}>
                               <div className="w-1.5 h-1.5 rounded-full bg-red-500 mr-1 shrink-0"></div>
                               {event.eventName}
                            </div>
                          ))}
                          {daySlots.map(slot => {
                            const isSelected = selectedSlots.some(s => s.id === slot.id);
                            return (
                              <button
                                key={slot.id}
                                disabled={isPast}
                                onClick={(e) => { e.stopPropagation(); onSlotToggle(slot); }}
                                className={`text-[10px] sm:text-xs w-full text-left px-1.5 py-1 rounded border transition-all ${isSelected ? 'bg-indigo-600 text-white border-indigo-600 shadow-md font-bold' : 'bg-indigo-50/80 text-indigo-700 border-indigo-100 hover:bg-indigo-100'}`}
                              >
                                {slot.startTime}
                              </button>
                            );
                          })}
                        </>
                      )}

                      {!isVisitor && (
                        <div className="flex flex-col gap-0.5 px-0.5 mt-auto pb-1">
                          {dayConfirmed.length > 0 && <span className="text-[10px] text-red-600 font-bold bg-red-50 px-1 rounded truncate flex items-center"><div className="w-1.5 h-1.5 rounded-full bg-red-500 mr-1 shrink-0"></div>{dayConfirmed.length} Event</span>}
                          {daySlots.length > 0 && <span className="text-[10px] text-indigo-600 font-bold bg-indigo-50 px-1 rounded truncate flex items-center"><div className="w-1.5 h-1.5 rounded-full bg-indigo-500 mr-1 shrink-0"></div>{daySlots.length} Slots</span>}
                        </div>
                      )}
                    </div>
                  </div>
                )
              })}
            </div>
          </div>

          {!isVisitor && hostSelectedDate && (
            <div className="lg:w-80 shrink-0 bg-slate-50 p-5 rounded-2xl border border-slate-200 h-fit animate-in slide-in-from-right-4 duration-300 shadow-sm sticky top-6">
              <div className="flex justify-between items-center mb-6">
                <h4 className="font-bold text-slate-800 text-lg flex items-center">
                  <CalendarIcon className="w-5 h-5 mr-2 text-indigo-500"/>
                  {format(parse(hostSelectedDate, 'yyyy-MM-dd', new Date()), 'MMM d, yyyy')}
                </h4>
                <button onClick={() => setHostSelectedDate(null)} className="text-slate-400 hover:bg-slate-200 p-1 rounded-full"><XCircle className="w-5 h-5"/></button>
              </div>
              
              <div className="mb-6">
                <h5 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Confirmed Events</h5>
                {(() => {
                  const events = confirmedBookings.flatMap(b => b.slots.filter(s => s.date === hostSelectedDate).map(s => ({...s, eventName: b.eventName, bookingId: b.id})));
                  if (events.length === 0) return <p className="text-sm text-slate-400 italic">No events planned.</p>;
                  return (
                    <div className="space-y-3">
                      {events.map(event => (
                        <div key={event.id} className="bg-white border border-red-100 p-3 rounded-xl shadow-sm border-l-4 border-l-red-500">
                          <p className="text-sm font-bold text-slate-800 mb-0.5">{event.eventName}</p>
                          <p className="text-xs text-slate-500 flex items-center"><Clock className="w-3 h-3 mr-1"/>{event.startTime} - {event.endTime}</p>
                          <button onClick={() => onCancelBooking(event.bookingId)} className="mt-3 w-full text-xs font-bold bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded-lg flex items-center justify-center"><Trash2 className="w-3 h-3 mr-1"/> Release Time</button>
                        </div>
                      ))}
                    </div>
                  );
                })()}
              </div>

              <div>
                <h5 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Available Slots</h5>
                {(() => {
                  const slots = availableSlots.filter(s => s.date === hostSelectedDate);
                  return (
                    <div className="space-y-2 mb-6">
                      {slots.length === 0 ? <p className="text-sm text-slate-400 italic mb-2">No slots open.</p> : (
                        slots.map(slot => (
                          <div key={slot.id} className="flex justify-between items-center bg-white border border-indigo-100 p-2.5 rounded-xl shadow-sm">
                            <span className="text-sm font-bold text-indigo-700 flex items-center"><Clock className="w-4 h-4 mr-1.5 text-indigo-400"/>{slot.startTime}</span>
                            <button onClick={() => setAvailableSlots(availableSlots.filter(s => s.id !== slot.id))} className="text-slate-300 hover:text-red-500 bg-slate-50 hover:bg-red-50 p-1.5 rounded-lg"><Trash2 className="w-4 h-4"/></button>
                          </div>
                        ))
                      )}
                    </div>
                  );
                })()}

                <div className="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
                  <h6 className="text-xs font-bold text-indigo-800 mb-3 flex items-center"><Plus className="w-3 h-3 mr-1"/> Add Time Slot</h6>
                  <div className="flex items-center gap-2 mb-3">
                    <div className="flex-1">
                      <label className="text-[10px] font-bold text-slate-500 uppercase">Start</label>
                      <input type="time" value={newTimeStart} onChange={e => setNewTimeStart(e.target.value)} className="w-full border-slate-200 rounded-lg px-2 py-1.5 text-sm outline-none focus:border-indigo-500 bg-white shadow-sm" />
                    </div>
                    <div className="flex-1">
                      <label className="text-[10px] font-bold text-slate-500 uppercase">End</label>
                      <input type="time" value={newTimeEnd} onChange={e => setNewTimeEnd(e.target.value)} className="w-full border-slate-200 rounded-lg px-2 py-1.5 text-sm outline-none focus:border-indigo-500 bg-white shadow-sm" />
                    </div>
                  </div>
                  <button onClick={handleAddSlot} className="w-full bg-indigo-600 text-white text-sm font-bold py-2 rounded-lg hover:bg-indigo-700 shadow-sm">Open Slot</button>
                </div>
              </div>
            </div>
          )}
        </div>
      )
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
